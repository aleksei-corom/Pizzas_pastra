name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (PySide6)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libegl1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libfontconfig1 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xinput0 \
            libxcb-xkb1 \
            xvfb

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
          DISPLAY: :99
        timeout-minutes: 10
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 1
          timeout 10m python run_tests.py

      - name: Run smoke test completo (headless)
        env:
          QT_QPA_PLATFORM: offscreen
          DISPLAY: :99
        timeout-minutes: 4
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 1
          timeout 3m python smoke_test_completo.py --headless
